<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOMS — Dedicated Micro-Architecture Portal</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #0f172a;
      --surface-border: #1e293b;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.15);
      --accent: #818cf8;
      --emerald: #34d399;
      --amber: #fbbf24;
      --rose: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--primary-glow);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    nav {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .tab-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }
    .tab-btn.active {
      color: #fff;
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.35);
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .action-btn {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      background: rgba(255, 255, 255, 0.02);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .action-btn:hover, .action-btn.active-panel {
      color: #fff;
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.1);
    }

    main {
      flex: 1;
      position: relative;
      background: #06090e;
      display: flex;
    }
    iframe {
      flex: 1;
      height: 100%;
      border: none;
      display: block;
    }

    /* On-Hover Entity Explainer Card */
    .entity-explainer-card {
      position: absolute;
      width: 360px;
      background: #0f172a;
      border: 1px solid #38bdf8;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(56, 189, 248, 0.2);
      border-radius: 10px;
      padding: 14px 16px;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.96) translateY(6px);
      transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1), transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .entity-explainer-card.visible {
      opacity: 1;
      visibility: visible;
      transform: scale(1) translateY(0);
    }
    .entity-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      margin-bottom: 6px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .entity-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }
    .entity-fullname {
      font-size: 11.5px;
      font-weight: 600;
      color: #cbd5e1;
      margin-top: 2px;
      margin-bottom: 10px;
    }
    .entity-divider {
      height: 1px;
      background: var(--surface-border);
      margin-bottom: 10px;
    }
    .entity-section {
      margin-bottom: 8px;
    }
    .entity-section:last-child {
      margin-bottom: 0;
    }
    .entity-section-title {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 3px;
    }
    .entity-purpose {
      font-size: 11.5px;
      color: #94a3b8;
      line-height: 1.45;
    }
    .entity-eoms {
      font-size: 11px;
      color: #34d399;
      background: rgba(52, 211, 153, 0.08);
      border-left: 2px solid #34d399;
      padding: 6px 8px;
      border-radius: 0 4px 4px 0;
      line-height: 1.4;
    }

    /* Dictionary Slide-over Drawer */
    .dictionary-drawer {
      position: absolute;
      top: 0;
      right: -520px;
      width: 500px;
      max-width: 90vw;
      height: 100%;
      background: #0f172a;
      border-left: 1px solid var(--surface-border);
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
      z-index: 500;
      display: flex;
      flex-direction: column;
      transition: right 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dictionary-drawer.open {
      right: 0;
    }
    .drawer-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .drawer-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .drawer-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .drawer-close:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .drawer-search {
      padding: 12px 20px;
      border-bottom: 1px solid var(--surface-border);
      background: #0b1120;
    }
    .search-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--primary);
    }
    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .dict-item {
      background: #162032;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px 14px;
      transition: border-color 0.15s ease;
    }
    .dict-item:hover {
      border-color: rgba(56, 189, 248, 0.4);
    }
    .dict-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .dict-abbr {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
    }
    .dict-category {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
      color: #94a3b8;
    }
    .dict-full {
      font-size: 12px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 6px;
    }
    .dict-meaning {
      font-size: 11.5px;
      color: #94a3b8;
      line-height: 1.45;
      margin-bottom: 8px;
    }
    .dict-eoms {
      font-size: 11px;
      color: #34d399;
      background: rgba(52, 211, 153, 0.08);
      border-left: 2px solid #34d399;
      padding: 6px 8px;
      border-radius: 0 4px 4px 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-title">
        EOMS Micro-Architectures
        <span class="badge">Archify Animated</span>
      </div>
    </div>
    <nav>
      <button class="tab-btn active" data-src="micro-auth-security.html">1. Auth & MFA Security</button>

  <main id="mainContainer">
    <iframe id="diagramFrame" src="micro-auth-security.html" title="EOMS Micro Architecture"></iframe>

    <!-- Floating Entity On-Hover Explainer Card -->
    <div id="entityExplainerCard" class="entity-explainer-card">
      <div class="entity-badge" id="expCategory">Component</div>

  <script>
    // Tab switching
    const frame = document.getElementById('diagramFrame');
    const openBtn = document.getElementById('openTab');
    const buttons = document.querySelectorAll('.tab-btn');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const src = btn.getAttribute('data-src');
        frame.src = src;
        openBtn.href = src;
      });
    });

    // Complete Entity Dictionary for all 6 diagrams
    const ENTITY_DICTIONARY = {
      // Auth & MFA
      "client": {

        fullName: "Single Page Application (React 18 + Vite)",
        category: "Frontend Layer",

    // Tooltip logic attached to entity hover
    const explainerCard = document.getElementById('entityExplainerCard');
    const expCategory = document.getElementById('expCategory');
    const expName = document.getElementById('expName');
    const expFullName = document.getElementById('expFullName');
    const expPurpose = document.getElementById('expPurpose');
    const expEoms = document.getElementById('expEoms');
    const mainContainer = document.getElementById('mainContainer');

    function showEntityTooltip(entityId, clientRect) {
      const data = ENTITY_DICTIONARY[entityId];
      if (!data) return;

      expCategory.textContent = data.category;
      expName.textContent = data.name;
      expFullName.textContent = data.fullName;
      expPurpose.textContent = data.purpose;
      expEoms.textContent = data.eoms;

      // Position tooltip card right near the entity inside mainContainer
      const containerRect = mainContainer.getBoundingClientRect();
      const cardWidth = 360;
      const cardHeight = 240;

      let left = clientRect.right + 14;
      let top = clientRect.top - containerRect.top;

      // If entity is too far right, show on left
      if (left + cardWidth > containerRect.width - 20) {
        left = clientRect.left - cardWidth - 14;
      }
      // Keep within bounds
      if (left < 10) left = 10;
      if (top + cardHeight > containerRect.height - 20) {
        top = Math.max(10, containerRect.height - cardHeight - 20);
      }
      if (top < 10) top = 10;

      explainerCard.style.left = `${left}px`;
      explainerCard.style.top = `${top}px`;
      explainerCard.classList.add('visible');
    }

    function hideEntityTooltip() {
      explainerCard.classList.remove('visible');
    }

    // Connect to SVG nodes inside the iframe
    function wireIframeEntities() {
      try {
        const iframeDoc = frame.contentDocument || frame.contentWindow.document;
        if (!iframeDoc) return;

        const nodes = iframeDoc.querySelectorAll('[data-node-id]');
        nodes.forEach(node => {
          node.style.cursor = 'help';
          
          node.addEventListener('mouseenter', () => {
            const id = node.getAttribute('data-node-id');
            const rect = node.getBoundingClientRect();
            // Get iframe offset
            const frameRect = frame.getBoundingClientRect();
            const combinedRect = {
              top: rect.top + frameRect.top,
              bottom: rect.bottom + frameRect.top,
              left: rect.left + frameRect.left,
              right: rect.right + frameRect.left,
              width: rect.width,
              height: rect.height
            };
            showEntityTooltip(id, combinedRect);
          });

          node.addEventListener('mouseleave', () => {
            hideEntityTooltip();
          });
        });
      } catch (err) {
        console.warn("Could not wire iframe entity hover:", err);
      }
    }

    frame.addEventListener('load', wireIframeEntities);
    // Initial call in case already loaded
    setTimeout(wireIframeEntities, 400);

    // Dictionary Drawer logic
    const dictList = document.getElementById('dictList');
    const searchInput = document.getElementById('dictSearch');

    function renderDictionary(filter = "") {
      const q = filter.toLowerCase().trim();
      const entries = Object.entries(ENTITY_DICTIONARY).map(([id, item]) => ({ id, ...item }));
      const filtered = entries.filter(item => 
        item.name.toLowerCase().includes(q) ||
        item.fullName.toLowerCase().includes(q) ||
        item.category.toLowerCase().includes(q) ||
        item.purpose.toLowerCase().includes(q) ||
        item.eoms.toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        dictList.innerHTML = `<div style="color: #64748b; font-size: 13px; text-align: center; padding: 40px 0;">No matching terms found.</div>`;
        return;
      }

      dictList.innerHTML = filtered.map(item => `
        <div class="dict-item">
          <div class="dict-header">
            <span class="dict-abbr">${item.name}</span>
            <span class="dict-category">${item.category}</span>
          </div>
          <div class="dict-full">${item.fullName}</div>
          <div class="dict-meaning">${item.purpose}</div>
          <div class="dict-eoms"><strong>In EOMS:</strong> ${item.eoms}</div>
        </div>
      `).join('');
    }

    renderDictionary();

    searchInput.addEventListener('input', (e) => {
      renderDictionary(e.target.value);
    });

    const dictDrawer = document.getElementById('dictDrawer');
    const toggleDictBtn = document.getElementById('toggleDictBtn');
    const closeDictBtn = document.getElementById('closeDictBtn');

    toggleDictBtn.addEventListener('click', () => {
      dictDrawer.classList.toggle('open');
      toggleDictBtn.classList.toggle('active-panel');
      if (dictDrawer.classList.contains('open')) {
        searchInput.focus();
      }
    });

    closeDictBtn.addEventListener('click', () => {
      dictDrawer.classList.remove('open');
      toggleDictBtn.classList.remove('active-panel');
    });
  </script>
