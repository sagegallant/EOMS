<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EOMS — Dedicated Micro-Architecture Portal</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-border: #1f293d;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.15);
      --text: #f3f4f6;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--primary-glow);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .tab-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.04);
    }
    .tab-btn.active {
      color: #fff;
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .action-btn {
      color: var(--text-muted);
      font-size: 12px;
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      transition: all 0.15s ease;
      background: rgba(255, 255, 255, 0.02);
    }
    .action-btn:hover {
      color: #fff;
      border-color: var(--primary);
    }
    main {
      flex: 1;
      position: relative;
      background: #06090e;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-title">
      EOMS Micro-Architectures
      <span class="badge">Archify Animated</span>
    </div>
    <nav>
      <button class="tab-btn active" data-src="micro-auth-security.html">1. Auth & MFA Security</button>
      <button class="tab-btn" data-src="micro-rbac-engine.html">2. RBAC Policy Cache</button>
      <button class="tab-btn" data-src="micro-provisioning-pipeline.html">3. Provisioning Tx</button>
      <button class="tab-btn" data-src="micro-asset-allocation.html">4. Asset Row-Locking</button>
      <button class="tab-btn" data-src="micro-document-vault.html">5. Document Vault</button>
      <button class="tab-btn" data-src="micro-lms-sla-engine.html">6. LMS Quiz & SLA</button>
    </nav>
    <div class="actions">
      <a id="openTab" class="action-btn" href="micro-auth-security.html" target="_blank" rel="noopener">Open Dedicated Window ↗</a>
    </div>
  </header>

  <main>
    <iframe id="diagramFrame" src="micro-auth-security.html" title="EOMS Micro Architecture"></iframe>
  </main>

  <script>
    const frame = document.getElementById('diagramFrame');
    const openBtn = document.getElementById('openTab');
    const buttons = document.querySelectorAll('.tab-btn');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const src = btn.getAttribute('data-src');
        frame.src = src;
        openBtn.href = src;
      });
    });
  </script>
</body>
</html>
